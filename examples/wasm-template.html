<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>{{NAME}}</title>
    <style>
      html,
      body,
      canvas {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: absolute;
        background: black;
      }
    </style>
  </head>
  <body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <script src="../mq_js_bundle.js"></script>
    <script>
      // Fixed "world" resolution every demo renders at, regardless of the
      // embedding iframe's actual physical size. mq_js_bundle.js sizes the
      // canvas's backing buffer to match the iframe's CSS pixel size by
      // default (see the resize() calls below) — fine on desktop, but on a
      // small phone viewport that means macroquad's screen_width()/height()
      // shrink too, so anything positioned by absolute pixel coordinates
      // (like the coordinates demo's circle) ends up somewhere near the
      // edge instead of where it logically should be. Locking the backing
      // buffer to a constant size and letting CSS (width/height: 100% above)
      // stretch it to fit instead keeps the "world" identical on every
      // device — everything just scales uniformly, like a camera pulling
      // back, rather than showing a cropped fragment of it.
      // Sized well above the demo's normal (non-fullscreen) display size
      // so stretching it to fill even a large monitor in fullscreen
      // doesn't look blurry. Cheap to render regardless of resolution —
      // these demos draw a couple of flat-shaded 2D shapes, not anything
      // fill-rate-heavy — so there's little cost to sizing up for crisp
      // fullscreen on a big screen.
      const LOGICAL_WIDTH = 2560;
      const LOGICAL_HEIGHT = 1920;

      function enforceLogicalSize() {
        if (canvas.width !== LOGICAL_WIDTH || canvas.height !== LOGICAL_HEIGHT) {
          canvas.width = LOGICAL_WIDTH;
          canvas.height = LOGICAL_HEIGHT;
          if (window.wasm_exports?.resize) wasm_exports.resize(LOGICAL_WIDTH, LOGICAL_HEIGHT);
        }
      }

      load("{{NAME}}.wasm");

      // mq_js_bundle.js resizes the canvas to match the iframe's current
      // CSS size on load and on further layout changes; run right after
      // to override it back to the fixed logical size. Checked on an
      // interval rather than tied to a specific event, since it's cheap
      // and there's no single reliable hook for "the bundle just resized
      // the canvas again".
      setInterval(enforceLogicalSize, 250);
    </script>
  </body>
</html>
