<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>{{NAME}}</title>
    <style>
      html,
      body,
      canvas {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: absolute;
        background: black;
      }
    </style>
  </head>
  <body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <script>
      // mq_js_bundle.js calls canvas.focus() as soon as it sets up WebGL
      // — synchronously, as part of its own top-level code, the moment
      // the script below finishes loading, before any script after it
      // gets a chance to run. A focus call on an element inside an
      // iframe that isn't fully in view makes the browser auto-scroll
      // the whole parent page down to it, which was yanking readers
      // away from the lesson text they were still reading — for every
      // demo, including ones that don't even use the keyboard. The
      // canvas doesn't need focus until someone actually means to use
      // it (see the click-to-focus instructions in "Как читать уроки"),
      // so patch focus() on this element, here, before the bundle script
      // below ever runs, to keep the browser from scrolling to it
      // without losing focus itself. Deliberately not "const canvas =
      // ..." — the bundle declares that same name itself right after
      // this script tag, and both share one global scope.
      const glcanvas = document.querySelector('#glcanvas');
      const nativeFocus = HTMLElement.prototype.focus;
      glcanvas.focus = function (options) {
        nativeFocus.call(this, { preventScroll: true, ...options });
      };
    </script>
    <script src="../mq_js_bundle.js"></script>
    <script>
      // Fixed "world" resolution every demo renders at, regardless of the
      // embedding iframe's actual physical size. mq_js_bundle.js sizes the
      // canvas's backing buffer to match the iframe's CSS pixel size by
      // default (see the resize() calls below) — fine on desktop, but on a
      // small phone viewport that means macroquad's screen_width()/height()
      // shrink too, so anything positioned by absolute pixel coordinates
      // (like the coordinates demo's circle) ends up somewhere near the
      // edge instead of where it logically should be. Locking the backing
      // buffer to a constant size and letting CSS (width/height: 100% above)
      // stretch it to fit instead keeps the "world" identical on every
      // device — everything just scales uniformly, like a camera pulling
      // back, rather than showing a cropped fragment of it.
      // Sized well above the demo's normal (non-fullscreen) display size
      // so stretching it to fill even a large monitor in fullscreen
      // doesn't look blurry. Cheap to render regardless of resolution —
      // these demos draw a couple of flat-shaded 2D shapes, not anything
      // fill-rate-heavy — so there's little cost to sizing up for crisp
      // fullscreen on a big screen.
      const LOGICAL_WIDTH = 2560;
      const LOGICAL_HEIGHT = 1920;

      // mq_js_bundle.js sizes the canvas through its own top-level
      // `resize(canvasEl, callback)` function, calling it from several
      // places — on the WASM module's startup, on every window resize,
      // and so on — normally basing the size on the iframe's actual CSS
      // pixel size. Redefining it here, before load() runs, makes every
      // one of those call sites use the fixed logical size instead,
      // including the very first one during startup: a plain script tag
      // sharing the page's one global scope, so this later declaration
      // simply replaces the bundle's own earlier one.
      //
      // That first call matters: a Rust program that computes something
      // once at startup (`let center_x = screen_width() / 2.0;`, say)
      // only ever sees whatever size the canvas has *right then*. An
      // earlier version of this file instead left the bundle's own
      // sizing alone and corrected canvas.width/height back afterwards
      // on a 250ms interval — fine for values recomputed every frame, but
      // a value computed once at startup could still capture the iframe's
      // real, un-fixed size for a moment before the interval's first tick.
      function resize(canvasEl, callback) {
        if (canvasEl.width !== LOGICAL_WIDTH || canvasEl.height !== LOGICAL_HEIGHT) {
          canvasEl.width = LOGICAL_WIDTH;
          canvasEl.height = LOGICAL_HEIGHT;
        }
        if (callback) callback(LOGICAL_WIDTH, LOGICAL_HEIGHT);
      }

      load("{{NAME}}.wasm");
    </script>
  </body>
</html>
